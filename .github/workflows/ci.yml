name: CI

on:
  push:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for secrets and personal data
        run: python3 .githooks/sensitive_scan.py all

  build:
    runs-on: ubuntu-latest
    needs: privacy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
